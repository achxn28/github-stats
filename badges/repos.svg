<svg xmlns="http://www.w3.org/2000/svg" width="70" height="20" role="img" aria-label="Owned repositories, including private repositories and forks: 21">
  <title>Owned repositories, including private repositories and forks: 21</title>
  <linearGradient id="shade" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round"><rect width="70" height="20" rx="3"/></clipPath>
  <g clip-path="url(#round)">
    <rect width="45" height="20" fill="#555"/>
    <rect x="45" width="25" height="20" fill="#F2A687"/>
    <rect width="70" height="20" fill="url(#shade)"/>
  </g>
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
    <text x="22.5" y="14" fill="#fff" textLength="33" lengthAdjust="spacingAndGlyphs">Repos</text>
    <text x="57.5" y="14" fill="#1f2328" textLength="13" lengthAdjust="spacingAndGlyphs">21</text>
  </g>
</svg>
