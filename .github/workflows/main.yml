name: Generate Stats Images

on:
  push:
    branches:
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: zig build

    - name: Generate images
      run: |
        mkdir -p "$RUNNER_TEMP/github-stats-output"
        ./zig-out/bin/github-stats \
          --overview-output-file "$RUNNER_TEMP/github-stats-output/overview.svg" \
          --languages-output-file "$RUNNER_TEMP/github-stats-output/languages.svg" \
          --json-output-file "$RUNNER_TEMP/github-stats.json"
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ github.repository }},${{ secrets.EXCLUDE_REPOS }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # Fall back to local Git history when the contributor API is unavailable.
        MAX_RETRIES: 5

    - name: Generate profile badges
      run: |
        python3 scripts/generate_badges.py \
          --stats-file "$RUNNER_TEMP/github-stats.json" \
          --output-dir "$RUNNER_TEMP/github-stats-output/badges"
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    - name: Publish generated images
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin generated > /dev/null; then
          git fetch origin generated
          git checkout -B generated FETCH_HEAD
        else
          git checkout --orphan generated
          git rm -rf --ignore-unmatch .
        fi
        cp "$RUNNER_TEMP/github-stats-output/overview.svg" overview.svg
        cp "$RUNNER_TEMP/github-stats-output/languages.svg" languages.svg
        mkdir -p badges
        cp "$RUNNER_TEMP/github-stats-output/badges/"*.svg badges/
        git add overview.svg languages.svg badges/*.svg
        if git diff --cached --quiet; then
          exit 0
        fi
        git commit -m "Update generated cards and profile badges"
        git push origin HEAD:generated

    - name: Remove temporary account data
      if: always()
      run: rm -f "$RUNNER_TEMP/github-stats.json"
