name: Update GitHub metrics

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: github-stats-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          user: achxn28
          token: ${{ secrets.ACCESS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_branch: generated
          committer_message: "chore: update GitHub metrics"
          filename: github-metrics.svg
          output_action: commit
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/New_York
          config_display: large
          extras_css: |
            @media (prefers-color-scheme: dark) {
              svg { color: #c9d1d9; }
              h1, h2, h3 { color: #58a6ff; }
              .field svg { fill: #8b949e; }
              footer { color: #8b949e; }
            }
          plugins_errors_fatal: yes
          retries: 3
          retries_delay: 15
          retries_output_action: 3
          retries_delay_output_action: 5
          plugin_introduction: no
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_calendar: yes
          plugin_calendar_limit: 2
